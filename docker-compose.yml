name: web-health-check

services:
  # Python checker (standard library only). Does the upstream fetch server-side.
  backend:
    build: .
    restart: unless-stopped

  # nginx serves the page and proxies /webcheck/ to the backend on one origin.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
