# Serves the page and proxies the check endpoint on the SAME origin, so the
# browser calls /webcheck/check without tripping CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Trailing slash strips the prefix: /webcheck/check -> backend:8000/check
    location /webcheck/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
