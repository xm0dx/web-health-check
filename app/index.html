<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloudflare Website Health Check</title>
<style>
  :root{
    --bg:#1a1815; --soft:#211f1b; --hover:#272320;
    --accent:#d97757; --accent2:#e8a87c;
    --up:#4fb477; --down:#f0635a; --warn:#e0a32e;
    --text:#e8e2d6; --dim:#928b7d; --faint:#6d675c; --border:#37332c;
    --mono: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Monaco,Consolas,
            "Liberation Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--mono); display:flex; align-items:flex-start;
    justify-content:center; padding:16px;
  }
  .card{
    width:100%; max-width:560px; background:var(--soft);
    border:1px solid var(--border); border-radius:14px; padding:28px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .star{color:var(--accent); font-size:26px; line-height:1}
  h1{font-size:17px; margin:10px 0 2px; font-weight:600; letter-spacing:.2px}
  .sub{color:var(--dim); font-size:12px; margin:0 0 22px}
  .sub::before{content:"$ "; color:var(--accent)}
  label{display:block; color:var(--dim); font-size:11px;
        text-transform:uppercase; letter-spacing:.8px; margin:8px 0 6px}
  .row{display:flex; gap:10px}
  input{
    flex:1; min-width:0; background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:11px 12px;
    font-family:var(--mono); font-size:14px; outline:none;
  }
  input:focus{border-color:var(--accent);
              box-shadow:0 0 0 2px rgba(217,119,87,.18)}
  button{
    padding:11px 16px; cursor:pointer; white-space:nowrap;
    background:var(--accent); color:var(--bg); border:none; border-radius:8px;
    font-family:var(--mono); font-size:14px; font-weight:600;
    transition:background .15s ease;
  }
  button:hover{background:var(--accent2)}
  button:disabled{opacity:.6; cursor:progress}

  .result{
    margin-top:22px; border:1px solid var(--border); border-radius:10px;
    padding:0; overflow:hidden; display:none;
  }
  .result.show{display:block}
  .banner{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; font-size:15px; font-weight:600;
  }
  .dot{width:11px; height:11px; border-radius:50%; flex:none}
  .up   .banner{background:rgba(79,180,119,.12);  color:var(--up)}
  .up   .dot{background:var(--up);   box-shadow:0 0 10px var(--up)}
  .warn .banner{background:rgba(224,163,46,.12);  color:var(--warn)}
  .warn .dot{background:var(--warn); box-shadow:0 0 10px var(--warn)}
  .down .banner{background:rgba(240,99,90,.12);   color:var(--down)}
  .down .dot{background:var(--down); box-shadow:0 0 10px var(--down)}
  .meta{padding:12px 16px; border-top:1px solid var(--border);
        font-size:12.5px; color:var(--dim); line-height:1.9}
  .meta b{color:var(--text); font-weight:600}
  .meta .k{display:inline-block; min-width:96px; color:var(--faint)}
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="star">✻</div>
    <h1>Cloudflare Website Health Check</h1>
    <p class="sub">enter a URL — I'll tell you if it's up<span class="caret">▋</span></p>

    <label for="u">website url</label>
    <div class="row">
      <input id="u" name="url" placeholder="example.com  or  https://example.com"
             autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
      <button id="b" type="submit">check</button>
    </div>

    <div class="result" id="r">
      <div class="banner"><span class="dot"></span><span id="rtext"></span></div>
      <div class="meta" id="rmeta"></div>
    </div>
  </form>

<script>
(function () {
  var f = document.getElementById("f"),
      u = document.getElementById("u"),
      b = document.getElementById("b"),
      r = document.getElementById("r"),
      rtext = document.getElementById("rtext"),
      rmeta = document.getElementById("rmeta");

  function show(cls, text, metaHtml) {
    r.className = "result show " + cls;
    rtext.textContent = text;
    rmeta.innerHTML = metaHtml || "";
  }

  function esc(s){ return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var val = u.value.trim();
    if (!val) return;
    b.disabled = true; b.textContent = "checking…";
    r.className = "result";

    fetch("/webcheck/check?url=" + encodeURIComponent(val))
      .then(function (res) { return res.json(); })
      .then(function (d) {
        var meta = "";
        if (d.status != null) meta += '<div><span class="k">HTTP status</span><b>' + esc(d.status) + '</b></div>';
        if (d.latency_ms != null) meta += '<div><span class="k">response time</span><b>' + esc(d.latency_ms) + ' ms</b></div>';
        if (d.final_url) meta += '<div><span class="k">final url</span><b>' + esc(d.final_url) + '</b></div>';
        if (d.server) meta += '<div><span class="k">server</span><b>' + esc(d.server) + '</b></div>';
        if (d.error) meta += '<div><span class="k">error</span><b>' + esc(d.error) + '</b></div>';

        if (d.ok) {
          show("up", "● Healthy — up and running", meta);
        } else if (d.up) {
          show("warn", "● Responding, but with errors", meta);
        } else {
          show("down", "● Down — not reachable", meta);
        }
      })
      .catch(function () {
        show("down", "● Check failed — backend unreachable", "");
      })
      .finally(function () {
        b.disabled = false; b.textContent = "check";
      });
  });
})();
</script>
</body>
</html>
